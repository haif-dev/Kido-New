<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Activez votre compte</title>
  </head>
  <body style="margin:0;padding:0;background:#FBF7F2;font-family:Manrope,system-ui,sans-serif;color:#2A1F1A;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#FBF7F2;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="background:#FFFFFF;border-radius:20px;box-shadow:0 1px 2px rgba(42,31,26,0.04),0 4px 12px rgba(42,31,26,0.06);overflow:hidden;">
            <tr>
              <td style="padding:32px 32px 0;text-align:center;">
                <div style="display:inline-block;width:40px;height:40px;border-radius:12px;background:radial-gradient(circle at 30% 30%,#E48D6A,#C45A3F 70%);"></div>
                <h1 style="font-family:Fraunces,Georgia,serif;font-weight:600;font-size:28px;margin:24px 0 8px;color:#2A1F1A;letter-spacing:-0.02em;">Bienvenue 👋</h1>
                <p style="margin:0 0 24px;color:#7A6F66;font-size:16px;line-height:1.5;">Confirmez votre adresse pour activer votre compte.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px;text-align:center;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#C45A3F;color:#FBF7F2;text-decoration:none;padding:14px 28px;border-radius:999px;font-weight:600;">Activer mon compte</a>
                <p style="margin:24px 0 0;color:#A89C90;font-size:13px;line-height:1.5;">Si vous n'avez pas créé de compte, ignorez cet e-mail.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;color:#A89C90;font-size:12px;">© Kido</p>
        </td>
      </tr>
    </table>
  </body>
</html>
